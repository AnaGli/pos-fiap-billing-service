services:
  migrate:
    build: .
    command: sh -c "alembic upgrade head"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/billing_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/billing_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  publisher:
    build: .
    command: python -m app.messaging.outbox_publisher
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/billing_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    command: python -m app.messaging.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/billing_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing_service
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
  workshop-net:
    external: true
