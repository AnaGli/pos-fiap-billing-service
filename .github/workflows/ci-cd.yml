name: Billing Service CI/CD

on:
  push:
    branches:
      - main
      - phase4
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: EKS-FIAP
  IMAGE_NAME: billing-service-tech-challenge
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          CATALOG_BACKEND: memory
        run: |
          coverage run -m pytest
          coverage xml -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-docker:
    name: Build and Push Docker Image
    needs:
      - test
      - sonarqube
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-eks:
    name: Deploy to Kubernetes (EKS)
    needs: build-docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Create or update application secret
        run: |
          kubectl create secret generic billing-service-secrets \
            --from-literal=DATABASE_URL="postgresql+psycopg://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}" \
            --from-literal=RABBITMQ_URL="${{ secrets.RABBITMQ_URL }}" \
            --from-literal=CATALOG_BACKEND="dynamodb" \
            --from-literal=AWS_REGION="${{ env.AWS_REGION }}" \
            --from-literal=DYNAMODB_TABLE_NAME="${{ secrets.DYNAMODB_TABLE_NAME }}" \
            --from-literal=DYNAMODB_ENDPOINT_URL="${{ secrets.DYNAMODB_ENDPOINT_URL }}" \
            --from-literal=MERCADO_PAGO_ACCESS_TOKEN="${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}" \
            --from-literal=MERCADO_PAGO_BASE_URL="${{ secrets.MERCADO_PAGO_BASE_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tag in manifests
        run: |
          sed -i.bak "s|anaglislere/billing-service-tech-challenge:latest|${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}|g" k8s/deployment-api.yaml
          sed -i.bak "s|anaglislere/billing-service-tech-challenge:latest|${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}|g" k8s/deployment-publisher.yaml
          sed -i.bak "s|anaglislere/billing-service-tech-challenge:latest|${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}|g" k8s/deployment-consumer.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment-api.yaml
          kubectl apply -f k8s/deployment-publisher.yaml
          kubectl apply -f k8s/deployment-consumer.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/billing-service-api --timeout=300s
          kubectl rollout status deployment/billing-service-publisher --timeout=300s
          kubectl rollout status deployment/billing-service-consumer --timeout=300s
